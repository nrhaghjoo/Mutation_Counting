[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncontextmut"
version = "1.0.0"
description = "Trinucleotide-context mutation analysis for multiple sequence alignments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "biopython>=1.81",
    "pandas>=1.5",
]

[project.scripts]
ncontextmut = "ncontextmut.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ncontextmut*"]
